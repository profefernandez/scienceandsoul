name: Deploy to VPS

# Triggers on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevents two deploys from overlapping. A newer push cancels an older
# in-progress deploy so the most recent commit always wins.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Where the built site should land on the VPS.
      REMOTE_PATH: /home/scienceandsoulcounselingcom/public_html
      # Public base path of the site (root of the domain).
      BASE_PATH: /
      # Any value; only required so vite.config.ts starts. The dev server
      # port is not used during `vite build`.
      PORT: "8080"
      # Public URL used for the post-deploy smoke test. Override with a repo
      # variable (Settings → Secrets and variables → Actions → Variables) if
      # the production domain ever changes.
      SITE_URL: ${{ vars.SITE_URL || 'https://scienceandsoulcounseling.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets are set
        run: |
          set -eu
          missing=""
          for name in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Set them at: Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @workspace/science-and-soul run build

      - name: Sanity-check build output
        run: |
          set -eu
          test -f artifacts/science-and-soul/dist/public/index.html \
            || { echo "::error::Build produced no index.html"; exit 1; }
          if [ ! -f artifacts/science-and-soul/dist/public/.htaccess ]; then
            echo "::warning::No .htaccess in build output — SPA routes and security headers won't be applied by Apache."
          fi
          echo "Built files:"
          ls -la artifacts/science-and-soul/dist/public/ | head -20

      - name: Configure SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the VPS host key so rsync/ssh do not prompt.
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote directory exists (first-time safe)
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${REMOTE_PATH}' && echo 'remote dir OK: ${REMOTE_PATH}'"

      - name: Upload site to VPS
        run: |
          set -eu
          # -a  archive mode (recursive + preserve perms/timestamps)
          # -v  verbose (each file shown in the workflow log)
          # -z  compress in transit
          # --delete  remove files on the server that no longer exist locally
          # --exclude  leave sPanel-owned entries in public_html alone
          rsync -avz --delete \
            --exclude 'cgi-bin/' \
            --exclude '.well-known/' \
            --exclude 'error_log' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            artifacts/science-and-soul/dist/public/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${REMOTE_PATH}/"

      - name: Verify deployment
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "ls -la '${REMOTE_PATH}/' | head -20 && echo '---' && wc -c '${REMOTE_PATH}/index.html'"

      # -----------------------------------------------------------------
      # Post-deploy smoke test / outage detection.
      #
      # Files are uploaded successfully but that doesn't guarantee the
      # public site is actually serving traffic (DNS, TLS, Apache/.htaccess,
      # or reverse-proxy issues can all still cause an outage). This step
      # polls the live homepage over HTTPS and fails the workflow — with a
      # clear, actionable log message — if the site isn't responding with a
      # real page within a reasonable time.
      #
      # This step is read-only (no writes to the server) and does not
      # affect the files already deployed above, so it cannot break or
      # roll back a deployment. It only reports success/failure.
      # -----------------------------------------------------------------
      - name: Smoke test — homepage responds
        run: |
          set -eu
          url="${SITE_URL}"
          attempts=5
          delay=6
          echo "Checking that $url responds after deploy..."

          for i in $(seq 1 "$attempts"); do
            http_code=$(curl -sS -o /tmp/homepage.html -w "%{http_code}" \
              --max-time 15 --location "$url" || echo "000")

            if [ "$http_code" = "200" ]; then
              echo "Attempt $i/$attempts: got HTTP $http_code"
              if grep -qi "<html" /tmp/homepage.html; then
                echo "Homepage responded with HTTP 200 and looks like HTML. Smoke test passed."
                exit 0
              else
                echo "::warning::HTTP 200 but response body doesn't look like HTML yet. Retrying..."
              fi
            else
              echo "Attempt $i/$attempts: got HTTP $http_code"
            fi

            if [ "$i" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done

          echo "::error::Post-deploy smoke test failed — $url did not return a valid homepage after $attempts attempts."
          echo "This likely indicates an outage (DNS, TLS, Apache/.htaccess, or reverse-proxy issue), not a bad build,"
          echo "since files were already confirmed present on the server in the previous step."
          echo "Last response body (truncated):"
          head -c 500 /tmp/homepage.html || true
          exit 1

      - name: Smoke test — API health check (optional)
        # Only meaningful if the api-server is deployed/reachable at /api/healthz
        # on the same host. Non-fatal: a missing API endpoint on a static-only
        # deployment should not fail the whole workflow.
        continue-on-error: true
        run: |
          set -eu
          url="${SITE_URL%/}/api/healthz"
          echo "Checking API health endpoint at $url..."
          http_code=$(curl -sS -o /tmp/healthz.json -w "%{http_code}" \
            --max-time 10 --location "$url" || echo "000")
          echo "API health check returned HTTP $http_code"
          cat /tmp/healthz.json 2>/dev/null || true
          if [ "$http_code" != "200" ]; then
            echo "::warning::API health endpoint did not return HTTP 200 (got $http_code). If the API is not deployed on this host, this is expected and can be ignored."
          fi
