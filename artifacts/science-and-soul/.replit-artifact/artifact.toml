kind = "web"
previewPath = "/"
title = "Science and Soul Counseling"
version = "1.0.0"
id = "artifacts/science-and-soul"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23173

[services.development]
run = "pnpm --filter @workspace/science-and-soul run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/science-and-soul", "run", "build" ]
publicDir = "artifacts/science-and-soul/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23173"
BASE_PATH = "/"
